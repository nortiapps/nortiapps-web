<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cuenta confirmada · Wuffi</title>
  <style>
    :root { --verde: #1D9E75; --texto: #1f2937; --suave: #6b7280; --fondo: #f6faf8; --tarjeta: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --texto: #e5e7eb; --suave: #9ca3af; --fondo: #0f1714; --tarjeta: #17211d; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--fondo); color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; background: var(--tarjeta); border-radius: 16px;
      padding: 32px 24px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icono { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    h1 { color: var(--verde); font-size: 24px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 12px; }
    .suave { color: var(--suave); font-size: 14px; }
    a { color: var(--verde); }
  </style>
</head>
<body>
  <main>
    <div class="icono" aria-hidden="true">🐾</div>
    <h1>¡Correo confirmado!</h1>
    <p>Tu cuenta de Wuffi ya está activa.</p>
    <p>Vuelve a la app e inicia sesión con tu correo y contraseña.</p>
    <p class="suave">¿Problemas para entrar? Escríbenos a
      <a href="mailto:nortiapps@gmail.com">nortiapps@gmail.com</a>.</p>
  </main>
</body>
</html>
